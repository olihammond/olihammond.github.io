    - company: Aarhus Universitet & Stockholms Universitet
      position: Postdoctoral Researcher
      location: Aarhus, Denmark & Stockholm, Sweden
      start_date: "2020-12"
      end_date: "2024-08"
      highlights:
      - Initially in the Department of Materials and Environmental Chemistry (Stockholm).
      - Group moved to the Department of Biological and Chemical Engineering (Aarhus) on 15/12/22, to continue work on Ionic Liquids (ILs) and Deep Eutectic Solvents (DES), using scattering to study nanostructure, and IL and DES-based nanoparticle synthesis methods.
      - Major collaboration with Prof Mark Rutland, Prof Sergei Glavatskih (KTH, Sweden), Prof Oleg Antzutkin (LTU, Sweden) and Prof Thomas Norrby (Nynas AB, Sweden), using SAXS, SANS, and neutron reflectivity to understand and develop lubricants *via* self-assembly of orthoborate ILs.

    - company: École Normale Supérieure de Lyon
      position: Postdoctoral Researcher
      location: Lyon, France
      start_date: "2019-10"
      end_date: "2020-12"
      highlights:
      - Working with Prof Agílio Padua and Dr Margarida Costa Gomes on Molecular Dynamics (MD) modelling of structure and solvation in Deep Eutectic Solvent (DES) mixtures.
      - Developing independent research into DES with pure theoretical studies and collaboration with local and international experimentalists.
      - Studied French to A2 Level at the ENS.

    - company: QUILL Centre, Queen's University Belfast
      position: Research Fellow
      location: Belfast, UK
      start_date: "2018-11"
      end_date: "2019-08"
      highlights:
      - Evaluating the potential of zwitterionic salts, ie. \[A⁺B⁺X⁻\]\[Y\]⁻ systems for protein-resistance with Prof John Holbrey and Dr Marijana Blesic.
      - Developed new zwitterions; analysis of solution structure and properties using neutron diffraction, EPSR modelling and quantum chemical calculations to determine hydration and kosmotropicity.
      - 'Teaching: Supervision of 3 Masters-level students.'

    - company: The University of Western Australia
