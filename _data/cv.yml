      - Adjunct position (0.2 FTE) within the School of Engineering Sciences in Chemistry, Biotechnology and Health, at the Division of Surface and Corrosion Science, in collaboration with Prof. Mark Rutland.
      - Focus on *‘Neutronspridning för studier av mjuka material’* (Neutron scattering of soft materials) with both educational and research activities.
      - Expert [member of the KTH RELAX](https://www.kth.se/relax/about/kth-experts-1.1423836) (Research using Large-Scale Experimental Facilities) programme

