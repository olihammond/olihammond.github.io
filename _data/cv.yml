      - Instrument Scientist at the Data Management & Scientific Computing (DMSC) division, for Small-angle neutron scattering operations at ESS, responsible for data handling in instrument development, analysis, reduction pipelines and commissioning.
      - Independent senior researcher with extensive experience in scattering, ionic solvents and data modelling.

    - company: KTH Royal Institute of Technology
