      - Collaboration with the group of Prof. Jason Harper on the topic of Ionic Liquids.

    - company: LINXS Institute of Advanced Neutron and X-ray science
      position: LINXS Fellow
      url: https://www.linxs.se/people-young-researchers-initiative/oliver-hammond
      location: Lund, Sweden
      start_date: "2025-01"
